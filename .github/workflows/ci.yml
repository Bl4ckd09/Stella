name: CI

on:
  pull_request:
  push:
    branches:
      - voxtral-hosted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voice/requirements-lock.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r voice/requirements-lock.txt
          .venv/bin/python -m pip install pip-audit==2.10.1

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Audit Python dependencies
        run: >-
          .venv/bin/python -m pip_audit
          -r voice/requirements-lock.txt
          --no-deps
          --disable-pip

      - name: Run TypeScript tests
        run: npm test

      - name: Run Python voice tests
        run: npm run test:voice

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build
